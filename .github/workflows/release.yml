name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24"
  PNPM_VERSION: "11"

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require a version tag that matches the app
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

  quality:
    name: Release quality gate
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - run: cargo test --all-targets --all-features
        working-directory: src-tauri

  macos:
    name: Build ad-hoc signed macOS distribution
    needs: [preflight, quality]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Build universal ad-hoc signed DMG
        run: pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg
      - name: Verify macOS distribution artifacts
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -type d -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -n "$app_path" && test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -F 'Signature=adhoc'
          hdiutil verify "$dmg_path"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build signed Windows distribution
    needs: [preflight, quality]
    runs-on: windows-2022
    env:
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_SHA1: ${{ vars.WINDOWS_CERTIFICATE_SHA1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: pnpm install --frozen-lockfile
      - name: Restore and pin the Windows code-signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in "WINDOWS_CERTIFICATE_PFX_BASE64", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_CERTIFICATE_SHA1") {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing release signing value: $name"
            }
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "mutsumi-mail-distribution.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $keyFlags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificatePath,
            $env:WINDOWS_CERTIFICATE_PASSWORD,
            $keyFlags
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The PFX does not contain a code-signing private key."
          }

          $actualFingerprint = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          $expectedFingerprint = ($env:WINDOWS_CERTIFICATE_SHA1 -replace '[:\s]', '').ToUpperInvariant()
          if ($actualFingerprint -ne $expectedFingerprint) {
            throw "Windows signing certificate fingerprint does not match the pinned value."
          }

          $windowsSdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem -Path $windowsSdkBin -Filter "signtool.exe" -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "Unable to locate the x64 Windows SDK signtool.exe."
          }

          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.signing.json"
          $signCommand = @{
            cmd = $signTool.FullName
            args = @(
              "sign", "/f", $certificatePath,
              "/p", $env:WINDOWS_CERTIFICATE_PASSWORD,
              "/fd", "SHA256",
              "/tr", "http://timestamp.digicert.com",
              "/td", "SHA256",
              "%1"
            )
          }
          @{ bundle = @{ windows = @{ signCommand = $signCommand } } } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path $configPath -Encoding utf8
          "TAURI_WINDOWS_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build signed MSI and NSIS installers
        shell: pwsh
        run: |
          $env:CARGO_INCREMENTAL = "0"
          pnpm tauri build --ci --bundles msi,nsis --config "$env:TAURI_WINDOWS_SIGNING_CONFIG"
      - name: Verify Windows installer signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedFingerprint = ($env:WINDOWS_CERTIFICATE_SHA1 -replace '[:\s]', '').ToUpperInvariant()
          $packages = @(Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File -Include *.msi,*.exe)
          if ($packages.Count -lt 2) {
            throw "Expected both MSI and NSIS distribution packages."
          }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -FilePath $package.FullName
            if ($signature.Status -in @("NotSigned", "HashMismatch")) {
              throw "Invalid Authenticode signature for $($package.FullName): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "No Authenticode signer certificate found for $($package.FullName)"
            }
            $actualFingerprint = ($signature.SignerCertificate.Thumbprint -replace '\s', '').ToUpperInvariant()
            if ($actualFingerprint -ne $expectedFingerprint) {
              throw "Unexpected signing certificate for $($package.FullName)"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP/mutsumi-mail-distribution.pfx", "$env:RUNNER_TEMP/tauri.windows.signing.json"

  android:
    name: Build signed Android distribution
    needs: [preflight, quality]
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
      ANDROID_NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y make perl
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          ndk_path="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}"
          toolchain_path="$ndk_path/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$toolchain_path/aarch64-linux-android24-clang"
          test -x "$toolchain_path/armv7a-linux-androideabi24-clang"
          {
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk_path"
            printf 'NDK_HOME=%s\n' "$ndk_path"
            printf 'PATH=%s:%s\n' "$toolchain_path" "$PATH"
            printf 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=%s/aarch64-linux-android24-clang\n' "$toolchain_path"
            printf 'CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=%s/armv7a-linux-androideabi24-clang\n' "$toolchain_path"
            printf 'CC_aarch64_linux_android=%s/aarch64-linux-android24-clang\n' "$toolchain_path"
            printf 'CC_armv7_linux_androideabi=%s/armv7a-linux-androideabi24-clang\n' "$toolchain_path"
            printf 'AR_aarch64_linux_android=%s/llvm-ar\n' "$toolchain_path"
            printf 'AR_armv7_linux_androideabi=%s/llvm-ar\n' "$toolchain_path"
            printf 'RANLIB_aarch64_linux_android=%s/llvm-ranlib\n' "$toolchain_path"
            printf 'RANLIB_armv7_linux_androideabi=%s/llvm-ranlib\n' "$toolchain_path"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: pnpm install --frozen-lockfile
      - name: Restore and pin the Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            ANDROID_CERTIFICATE_SHA256; do
            test -n "${!value}" || { echo "Missing release signing value: $value" >&2; exit 1; }
          done

          keystore_path="$RUNNER_TEMP/mutsumi-mail-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          actual_fingerprint="$(keytool -list -v -keystore "$keystore_path" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F ': ' '/SHA256:/{ print $2; exit }' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$ANDROID_CERTIFICATE_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual_fingerprint" = "$expected_fingerprint" || { echo "Android signing certificate fingerprint does not match the pinned value." >&2; exit 1; }

          umask 077
          {
            printf 'storeFile=%s\n' "$keystore_path"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed universal APK and AAB
        run: pnpm tauri android build --ci --apk --aab --target aarch64 --target armv7
      - name: Re-sign the final Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          aab_path="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$aab_path"
          command -v zip >/dev/null
          mapfile -t old_signatures < <(
            unzip -Z1 "$aab_path" |
              grep -E '^META-INF/[^/]+\.(SF|RSA|DSA)$|^META-INF/MANIFEST\.MF$'
          )
          test "${#old_signatures[@]}" -gt 0
          zip -d "$aab_path" "${old_signatures[@]}"
          jarsigner \
            -keystore "$RUNNER_TEMP/mutsumi-mail-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$aab_path" \
            "$ANDROID_KEY_ALIAS"
      - name: Verify Android package signatures
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          aab_path="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$apk_path" && test -n "$aab_path"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk_path"
          jarsigner -verify -certs "$aab_path"
          expected_fingerprint="$(printf '%s' "$ANDROID_CERTIFICATE_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          apk_fingerprint="$("$apksigner" verify --print-certs "$apk_path" | awk -F ': ' '/SHA-256 digest:/{ print $2; exit }' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          aab_fingerprint="$(keytool -printcert -jarfile "$aab_path" | awk -F ': ' '/SHA256:/{ print $2; exit }' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$apk_fingerprint" = "$expected_fingerprint"
          test "$aab_fingerprint" = "$expected_fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/mutsumi-mail-release.jks"

  publish:
    name: Publish release assets
    needs: [preflight, quality, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          merge-multiple: true
          path: release-assets
      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -not -name SHA256SUMS.txt -print0 | sort -z)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            sha256sum "$asset"
          done > release-assets/SHA256SUMS.txt
          assets+=(release-assets/SHA256SUMS.txt)

          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GH_REPO" \
              --title "Mutsumi Mail ${GITHUB_REF_NAME#v}" \
              --notes $'首个公开版本。\n\nmacOS 包使用固定 ad-hoc 签名且未经过 Apple 公证；首次打开如被拦截，请在“系统设置 → 隐私与安全性”中允许。Windows 包使用项目固定的自签名证书，Android 包使用项目固定 keystore。请使用随附 SHA256SUMS.txt 校验下载文件。' \
              --verify-tag
          fi
