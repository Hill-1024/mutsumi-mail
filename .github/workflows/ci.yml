name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

  rust:
    needs: rust-format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - name: Run Rust tests
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          mv capabilities/default.json capabilities/default.json.disabled
          trap 'mv capabilities/default.json.disabled capabilities/default.json' EXIT
          cargo test --locked --lib --no-default-features
      - name: Run Rust tests and diagnose Windows loader failures
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          Move-Item "capabilities/default.json" "capabilities/default.json.disabled"
          try {
            cargo test --locked --lib --no-default-features
            $testExit = $LASTEXITCODE
          } finally {
            Move-Item "capabilities/default.json.disabled" "capabilities/default.json"
          }
          if ($testExit -ne 0) {
            $testBinary = Get-ChildItem ".\target\debug\deps\mutsumi_mail_lib-*.exe" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $visualStudio = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            Write-Host "Windows loader diagnostics for $($testBinary.FullName)"
            & $dumpbin.FullName /dependents $testBinary.FullName
            & $dumpbin.FullName /imports $testBinary.FullName
          }
          exit $testExit
      - name: Smoke test Windows desktop startup
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --locked --bin mutsumi-mail
          $process = Start-Process -FilePath ".\target\debug\mutsumi-mail.exe" -ArgumentList "--background" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "Mutsumi Mail exited during the Windows startup smoke test with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id -Force

  tauri-build-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@1.94.0
      - run: cargo check --locked
        working-directory: src-tauri

  android-background:
    name: Android background service build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Configure Android toolchain
        shell: bash
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          mail_ndk="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          mail_tools="$mail_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            printf 'ANDROID_NDK_HOME=%s\n' "$mail_ndk"
            printf 'NDK_HOME=%s\n' "$mail_ndk"
            printf 'CC_aarch64_linux_android=%s/aarch64-linux-android24-clang\n' "$mail_tools"
            printf 'AR_aarch64_linux_android=%s/llvm-ar\n' "$mail_tools"
            printf 'RANLIB_aarch64_linux_android=%s/llvm-ranlib\n' "$mail_tools"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: Build JNI engine, services and manifest together
        run: pnpm tauri android build --ci --debug --apk --target aarch64
