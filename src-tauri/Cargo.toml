[package]
name = "mutsumi-mail"
version = "0.1.0"
description = "Mutsumi Mail offline-first desktop client"
authors = ["Mutsumi Mail contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "mutsumi_mail_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "mutsumi-mail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde", "clock"] }
imap-proto = "0.16.7"
keyring = { version = "4.2.0", default-features = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls", "tokio1-native-tls"] }
mail-parser = { version = "0.11.8", features = ["full_encoding"] }
native-tls = "0.2.14"
nom = "7.1.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
tokio-native-tls = "0.3.1"
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "android")'.dependencies]
# `native-tls` is shared by IMAP and SMTP. On Android it needs a target OpenSSL,
# so build a vendored copy with the NDK instead of probing the macOS/Linux host.
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.23.0"
